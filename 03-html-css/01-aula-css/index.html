<!DOCTYPE html>
<!--
  Projeto: Meta Escola — Cadastro de Alunos
  Aula: introdução a formulários e CSS externo.
  Estrutura da página: cabeçalho, formulário de cadastro e rodapé.
-->
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tela de cadastro de alunos da Meta Escola (exercício de HTML e CSS).">

    <title>Cadastro de Aluno | Meta Escola</title>

    <!-- Folha de estilo externa: todo o visual fica no style.css -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Cabeçalho com o nome da instituição -->
    <header>
        <h1>Meta Escola</h1>
        <p>Cadastro de Alunos</p>
    </header>

    <main>

        <!-- Cartão central com o formulário -->
        <section class="cadastro">

            <h2>Crie sua conta</h2>

            <p class="descricao">
                Preencha os dados abaixo para realizar seu cadastro
            </p>

            <form>

                <!-- Campo de nome completo -->
                <label for="nome">Nome completo</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>

                <!-- Campo de e-mail (o type="email" valida o formato) -->
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>

                <!-- Lista de cursos disponíveis -->
                <label for="curso">Curso</label>
                <select id="curso" name="curso" required>
                    <option value="">Selecione um curso</option>
                    <option value="desenvolvimento">Desenvolvimento de Sistemas</option>
                    <option value="enfermagem">Enfermagem</option>
                    <option value="montagem">Montagem e Manutenção de Computadores</option>
                    <option value="redes">Redes de Computadores</option>
                    <option value="seguranca">Segurança da Informação</option>
                    <option value="seguranca-do-trabalho">Segurança do Trabalho</option>
                </select>

                <!-- Senha e confirmação de senha -->
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>

                <label for="confirmar-senha">Confirmar senha</label>
                <input type="password" id="confirmar-senha" name="confirmar-senha"
                    placeholder="Digite novamente sua senha" required>

                <button type="submit">Cadastrar</button>

            </form>

            <p class="login">
                Já possui uma conta?
                <a href="#">Entrar</a>
            </p>

        </section>

    </main>

    <!-- Rodapé com os direitos autorais -->
    <footer>
        <p>&copy; 2026 Vinicio Daileson - Todos os direitos reservados.</p>
    </footer>

</body>

</html>
